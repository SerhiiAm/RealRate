[project]
name = "realrate"
version = "0.1.0"
description = "RealRate backend API"
authors = [
    {name = "Serhii",email = "ambartsumov.work@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.6,<0.18.0)"
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import sorting
    "B",   # flake8-bugbear: likely bugs
    "UP",  # pyupgrade: modern Python syntax
    "DJ",  # flake8-django: Django-specific checks
]
ignore = ["E501"]

